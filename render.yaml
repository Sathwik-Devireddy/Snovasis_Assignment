# Render Blueprint for BalanceVault
# Save this file as render.yaml in the repository root.
# Node.js workspace commands run from the repository root.

services:
  # Fastify API: private to this Render workspace.
  - type: pserv
    name: balancevault-api
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build --workspace=@balancevault/api
    startCommand: npm run start --workspace=@balancevault/api
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: COOKIE_SECURE
        value: "true"
      # The Next.js service calls the API over Render's private network.
      - key: APP_ORIGIN
        sync: false
      # These are intentionally supplied after the database roles are bootstrapped.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_OWNER
        sync: false
      # Temporary bootstrap connection: Render's initial PostgreSQL owner.
      - key: DATABASE_URL_BOOTSTRAP
        fromDatabase:
          name: balancevault-db
          property: connectionString
      - key: OWNER_ROLE_PASSWORD
        generateValue: true
      - key: APP_ROLE_PASSWORD
        generateValue: true
      - key: REDIS_URL
        fromService:
          name: balancevault-redis
          type: keyvalue
          property: connectionString

  # Next.js frontend: public web service.
  - type: web
    name: balancevault-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build --workspace=@balancevault/web
    startCommand: npm run start --workspace=@balancevault/web
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # API is private; service name is its internal DNS hostname.
      - key: API_INTERNAL_URL
        value: http://balancevault-api:4000

  # Redis-compatible service used only for rate limiting.
  - type: keyvalue
    name: balancevault-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: balancevault-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: balancevault
    ipAllowList: []
